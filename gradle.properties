# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE UI will override
# any options specified in this file.

# Specifies the JVM arguments used for the Gradle Daemon.
# Setting lower max memory (-Xmx2048m) prevents OOM crashes on Linux.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8

# Enable parallel compilation & build cache
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX enabled
android.useAndroidX=true
android.nonTransitiveRclass=true

# Specify Java 17 for Gradle JVM to avoid compatibility issues with JDK 25
org.gradle.java.home=/usr/lib/jvm/java-17-openjdk-amd64

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
